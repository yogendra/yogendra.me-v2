name: Beta Deployment
on:
  push:
    branches:
      - main
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:

jobs:
  beta-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build and Deploy to Beta
        uses: ./.github/actions/devcontainer-action
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOGENDRA_ME }}
        with:
          entrypoint: task
          args: beta:deploy

      - name: Get Latest Tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git rev-list -1 --before="00:00:00" HEAD)
          fi
          # Fallback to root commit if no commit exists before today
          LATEST_TAG=${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD)}
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          TAG=${{ steps.get_tag.outputs.tag }}
          CHANGELOG=$(git log $TAG..HEAD --oneline)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes since last tag."
          fi
          # Escape newlines for GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get Changed Files
        id: files
        run: |
          TAG=${{ steps.get_tag.outputs.tag }}
          FILES=$(git diff --name-only $TAG..HEAD)
          if [ -z "$FILES" ]; then
            FILES="No files changed."
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get Build Info
        id: build_info
        run: |
          HUGO_VERSION=$(hugo version | awk '{print $2}')
          echo "hugo=$HUGO_VERSION" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Render Issue Body
        id: render
        uses: chuhlomin/render-template@v1
        with:
          template: .github/ISSUE_TEMPLATE/BETA_TESTING.md
          vars: |
            DEPLOYED_AT: ${{ github.event.head_commit.timestamp || 'Now' }}
            COMMIT_SHA: ${{ github.sha }}
            BASELINE_TAG: ${{ steps.get_tag.outputs.tag }}
            AUTHOR: ${{ steps.build_info.outputs.author }}
            HUGO_VERSION: ${{ steps.build_info.outputs.hugo }}
            ACTION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            DIFF_URL: https://github.com/${{ github.repository }}/compare/${{ steps.get_tag.outputs.tag }}...${{ github.sha }}
            CHANGELOG: ${{ steps.changelog.outputs.changelog }}
            CHANGED_FILES: ${{ steps.files.outputs.files }}

      - name: Create or Update Beta Testing Issue
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ steps.render.outputs.result }}
        with:
          script: |
            const body = process.env.ISSUE_BODY;
            const label = 'beta-testing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label]
            });

            if (issues.length > 0) {
              const issue = issues[0];
              const issueNumber = issue.number;
              
              // Post current body as a comment for history
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `### Previous Build Details\n\n${issue.body}`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                title: `Beta Release: ${context.sha.substring(0, 7)}`,
                body: body
              });
              console.log(`Updated issue #${issueNumber} and added history comment`);
            } else {
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Beta Release: ${context.sha.substring(0, 7)}`,
                body: body,
                labels: [label],
                assignees: ['yogendra']
              });
              console.log(`Created issue #${newIssue.number}`);
            }

      - name: Generate Step Summary
        run: |
          echo "## 🚀 Beta Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL:** [https://beta.yogendra.me](https://beta.yogendra.me)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hugo Version:** ${{ steps.build_info.outputs.hugo }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Changelog" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changelog.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠 Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.files.outputs.files }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Beta Testing Ticket](https://github.com/${{ github.repository }}/issues?q=label%3Abeta-testing+is%3Aopen)" >> $GITHUB_STEP_SUMMARY
