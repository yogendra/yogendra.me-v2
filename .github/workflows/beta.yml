name: 🧪 Deploy to Beta Testing
on:
  push:
    branches:
      - main
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🔨 Build and Deploy
    runs-on: ${{ fromJSON(vars.RUNNER_TYPE || '"ubuntu-latest"') }}
    container:
      image: ghcr.io/yogendra/yogendra.me-v2-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: ⚙️ Configure Git Safe Directory
        run: git config --system --add safe.directory '*'

      - name: 📦 Cache Hugo Build Assets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/hugo_cache
            resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('assets/**', 'content/**', 'config/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-
      
      - name: 🚀 Build and Deploy to Beta
        id: build_and_deploy
        run: | 
          task version VERSION="${{ github.sha }}"
          task beta:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📊 Get Build Info
        id: build_info
        run: |
          echo "build_info<<EOF" >> $GITHUB_OUTPUT
          task build-info >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: 🏷️ Get Production Version
        id: prod_version
        run: |          
          PROD_VERSION="$(task prod_version)"
          echo "Production Version: $PROD_VERSION"
          echo "prod_version=$PROD_VERSION" >> $GITHUB_OUTPUT

      - name: 🪵 Generate Changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          task changelog >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📁 Get Changed Files
        id: files
        run: |         
          echo "files<<EOF" >> $GITHUB_OUTPUT
          task changes >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎯 Next Release Version
        id: next_version
        run: |
          NEXT_VERSION="$(task next_version)"
          echo "Next Version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: 🎟️ Create Testing Ticket
        id: create-issue
        uses: actions/github-script@v9
        env:          
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
          DEPLOYED_AT: "${{ github.event.head_commit.timestamp || 'Now' }}"
          COMMIT_SHA: "${{ github.sha }}"
          PRODUCTION_VERSION: "${{ steps.prod_version.outputs.prod_version }}"
          AUTHOR: "${{ github.event.head_commit.author.name }}"
          BUILD_INFO: ${{ steps.build_info.outputs.build_info }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DIFF_URL: "https://github.com/${{ github.repository }}/compare/${{ steps.prod_version.outputs.prod_version }}...${{ github.sha }}"
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('.github/ISSUE_TEMPLATE/BETA_TESTING.md', 'utf8');

            // Strip YAML frontmatter
            body = body.replace(/^---[\s\S]*?---\n*/, '');

            const replacements = {
              '{{ env.DEPLOYED_AT }}': process.env.DEPLOYED_AT,
              '{{ env.COMMIT_SHA }}': process.env.COMMIT_SHA,
              '{{ env.PRODUCTION_VERSION }}': process.env.PRODUCTION_VERSION,
              '{{ env.AUTHOR }}': process.env.AUTHOR,
              '{{ env.ACTION_URL }}': process.env.ACTION_URL,
              '{{ env.DIFF_URL }}': process.env.DIFF_URL,
              '{{ env.BUILD_INFO }}': process.env.BUILD_INFO,
              '{{ env.CHANGELOG }}': process.env.CHANGELOG,
              '{{ env.CHANGED_FILES }}': process.env.CHANGED_FILES
            };

            for (const [key, val] of Object.entries(replacements)) {
              body = body.split(key).join(val || '');
            }

            const title = `🔨Beta Release : ${process.env.NEXT_VERSION}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['beta-testing']
            });

            let issue;
            if (openIssues.length > 0) {
              issue = (await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                title,
                body
              })).data;
            } else {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['beta-testing'],
                assignees: ['yogendra']
              })).data;
            }

            core.setOutput('number', issue.number);
            core.setOutput('url', issue.html_url);
      - name: 📢 Generate Summary
        id: summary
        run: |
          echo "## 🚀 Beta Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "[Beta Testing Ticket #${{steps.create-issue.outputs.number}}](${{steps.create-issue.outputs.url}})" >> $GITHUB_STEP_SUMMARY
