name: 🧪 Deploy to Beta Testing
on:
  push:
    branches:
      - main
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🔨 Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          
      - name: 🔓 Prepare cache directories
        run: |
          sudo mkdir -p /usr/local/bin ~/.cache ~/conda_pkgs_dir
          sudo chown -R $USER:$USER /usr/local/bin ~/.cache ~/conda_pkgs_dir

      - name: 📦 Cache Task CLI
        id: cache-task
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/task
          key: ${{ runner.os }}-task-v3.38.0

      - name: Install Task CLI if missing from cache
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.38.0

      - name: 📦 Cache Tools & Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            /usr/local/bin/hugo
            /usr/local/bin/sass
          key: ${{ runner.os }}-tools-${{ hashFiles('Taskinit.yml') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: 📦 Cache Conda packages
        uses: actions/cache@v6
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-conda-

      - name: 📦 Cache Hugo Build Assets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/hugo_cache
            resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('assets/**', 'content/**', 'config/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: 🐍 Setup Conda
        id: setup_conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: yogendra-me
          environment-file: environment.yml
          pkgs-dirs: ~/conda_pkgs_dir
          auto-activate: false
          use-mamba: true

      - name: 🎬 Initialize Environment
        id: init
        run: task init
      
      - name: 🚀 Build and Deploy to Beta
        id: build_and_deploy
        run: | 
          task version VERSION="${{ github.sha }}"
          task beta:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📊 Get Build Info
        id: build_info
        run: |
          echo "build_info<<EOF" >> $GITHUB_OUTPUT
          task build-info >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: 🏷️ Get Production Version
        id: prod_version
        run: |          
          PROD_VERSION="$(task prod_version)"
          echo "Production Version: $PROD_VERSION"
          echo "prod_version=$PROD_VERSION" >> $GITHUB_OUTPUT

      - name: 🪵 Generate Changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          task changelog >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📁 Get Changed Files
        id: files
        run: |         
          echo "files<<EOF" >> $GITHUB_OUTPUT
          task changes >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎯 Next Release Version
        id: next_version
        run: |
          NEXT_VERSION="$(task next_version)"
          echo "Next Version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: 🎟️ Create Testing Ticket
        id: create-issue
        uses: JasonEtco/create-an-issue@v2.9.2
        with:
          filename: .github/ISSUE_TEMPLATE/BETA_TESTING.md
          update_existing: true
          search_existing: open
        env:          
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_AT: "${{ github.event.head_commit.timestamp || 'Now' }}"
          COMMIT_SHA: "${{ github.sha }}"
          PRODUCTION_VERSION: "${{ steps.prod_version.outputs.prod_version }}"
          AUTHOR: "${{ github.event.head_commit.author.name }}"
          BUILD_INFO: ${{ steps.build_info.outputs.build_info }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DIFF_URL: "https://github.com/${{ github.repository }}/compare/${{ steps.prod_version.outputs.prod_version }}...${{ github.sha }}"
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
      - name: 📢 Generate Summary
        id: summary
        run: |
          echo ## 🚀 Beta Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "[Beta Testing Ticket #${{steps.create-issue.outputs.number}}](${{steps.create-issue.outputs.url}})" >> $GITHUB_STEP_SUMMARY
