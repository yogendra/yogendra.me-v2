name: Beta Deployment
on:
  push:
    branches:
      - main
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:

jobs:
  beta-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Initialize Environment
        run: task init

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: yogendra-me
          environment-file: environment.yml
          auto-activate-base: false


      - name: Build and Deploy to Beta
        run: task beta:deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOGENDRA_ME }}

      - name: Get Build Info
        id: build_info
        run: |
          echo "build_info<<EOF" >> $GITHUB_OUTPUT
          task build-info >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Get Last Release Tag
        id: get_last_release_tag
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git rev-list -1 --before="00:00:00" HEAD)
          fi
          # Fallback to root commit if no commit exists before today
          LATEST_TAG=${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD)}
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          TAG=${{ steps.get_last_release_tag.outputs.tag }}
          CHANGELOG=$(git log $TAG..HEAD --oneline)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes since last tag."
          fi
          # Escape newlines for GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get Changed Files
        id: files
        run: |
          TAG=${{ steps.get_last_release_tag.outputs.tag }}
          FILES=$(git diff --stat $TAG..HEAD)
          if [ -z "$FILES" ]; then
            FILES="No files changed."
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Issue
        uses: JasonEtco/create-an-issue@v2
        id: create-issue
        with:
          filename: .github/ISSUE_TEMPLATE/BETA_TESTING.md
          update_existing: true
          search_existing: open
        env:
          VERSION: "After ${{ steps.get_last_release_tag.outputs.tag }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_AT: "${{ github.event.head_commit.timestamp || 'Now' }}"
          COMMIT_SHA: "${{ github.sha }}"
          BASELINE_TAG: "${{ steps.get_last_release_tag.outputs.tag }}"
          AUTHOR: "${{ github.event.head_commit.author.name }}"
          BUILD_INFO: ${{ steps.build_info.outputs.build_info }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DIFF_URL: "https://github.com/${{ github.repository }}/compare/${{ steps.get_last_release_tag.outputs.tag }}...${{ github.sha }}"
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
      - name: Generate Step Summary
        run: |
          echo "## 🚀 Beta Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL:** [https://beta.yogendra.me](https://beta.yogendra.me)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hugo Version:** ${{ steps.build_info.outputs.hugo }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Changelog" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changelog.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠 Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.files.outputs.files }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Beta Testing Ticket #${{steps.create-issue.outputs.number}}](${{steps.create-issue.outputs.url}})" >> $GITHUB_STEP_SUMMARY
