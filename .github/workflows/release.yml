name: 🎯 Release To Production
on:
  push:
    tags:
      - 'v*'
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
jobs:
  publish:
    name: 🚀 Publish to Production
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.YMEGHIO_PAT }}

      - name: 🔓 Prepare cache directories
        run: |
          sudo mkdir -p /var/cache/apt/archives /usr/local/bin/src ~/.cache
          sudo chown -R $USER:$USER /var/cache/apt/archives /usr/local/bin ~/.cache

      - name: 📦 Cache Task CLI
        id: cache-task
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/task
          key: ${{ runner.os }}-task-v3.38.0

      - name: Install Task CLI if missing from cache
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.38.0


      - name: 📦 Cache NPM, Tools & Conda Pkgs
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/conda_pkgs_dir
            /usr/share/miniconda/pkgs
            /usr/local/bin/hugo
            /usr/local/bin/sass
            /usr/local/bin/src
            /var/cache/apt/archives
          key: ${{ runner.os }}-setup-${{ hashFiles('Taskinit.yml', 'environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-setup-

      - name: 🐍 Setup Conda
        id: setup_conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: yogendra-me
          environment-file: environment.yml
          pkgs-dirs: ~/conda_pkgs_dir
          auto-activate-base: false
          use-mamba: true

      - name: 🎬 Initialize Environment
        id: init
        run: task init

      - name: 🧱 Build Pages
        id: build
        run: |
          task version VERSION="${{ github.ref_name }}"
          task release:build

      - name: 🚀 Publish to Cloudflare
        id: publish_cloudflare
        run: task cloudflare:publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: 🚀 Publish to Github
        id: publish_github
        env:
          YMEGHIO_PAT: ${{ secrets.YMEGHIO_PAT }}
        run: task github:publish        
      
    
      # - name: 🚀 Publish to Github
      #   id: publish_github
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     personal_token: ${{ secrets.YMEGHIO_PAT }}          
      #     external_repository: yogendra/yogendra.github.io
      #     publish_branch: main
      #     publish_dir: ./public/github

      - name: 🔏 Update and Close Testing Ticket
        id: close_ticker
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'beta-testing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: [label],
              per_page: 5
            });

            if (issues.length > 0) {
              const issueNumber = issues[0].number;
              const tag = context.ref.replace('refs/tags/', '');
              const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              
              const comment = `## ✅ Production Release Complete\n\n- **Release Tag:** \`${tag}\`\n- **Production URL:** [https://yogendra.me](https://yogendra.me)\n- **Release Build:** [View Logs](${runUrl})\n- **Status:** Closed and Released to Production.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });

              if (!issues[0].locked) {
                await github.rest.issues.lock({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  lock_reason: 'resolved'
                });
              }
              console.log(`Updated, closed, and locked issue #${issueNumber}`);
            } else {
              console.log('No beta-testing issue found.');
            }

      - name: 📢 Generate Summary
        id: summary
        run: |
          echo "## 🎊 Production Release Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL:** [https://yogendra.me](https://yogendra.me)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The beta testing issue has been updated and closed." >> $GITHUB_STEP_SUMMARY
