# https://github.com/firebase/firebase-tools

name: Build Site
on:
  push:
    tags:
      - 'v*'
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Task
        uses: go-task/setup-task@v1
        
      - name: Initialize Environment
        run: task init

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: yogendra-me
          environment-file: environment.yml
          auto-activate-base: false

      - name: Build Pages
        run: |
          task version VERSION="${{ github.ref_name }}"
          task release:build

      - name: Publish to Firebase
        run: task release:publish
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOGENDRA_ME }}
    
      - name: Publish to Github
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          personal_token: ${{ secrets.YMEGHIO_PAT }}          
          external_repository: yogendra/yogendra.github.io
          publish_branch: main
          publish_dir: ./public/github

      - name: Update and Close Beta Issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'beta-testing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label]
            });

            if (issues.length > 0) {
              const issueNumber = issues[0].number;
              const tag = context.ref.replace('refs/tags/', '');
              const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              
              const comment = `## ✅ Production Release Complete\n\n- **Release Tag:** \`${tag}\`\n- **Production URL:** [https://yogendra.me](https://yogendra.me)\n- **Release Build:** [View Logs](${runUrl})\n- **Status:** Closed and Released to Production.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });

              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                lock_reason: 'resolved'
              });
              console.log(`Updated, closed, and locked issue #${issueNumber}`);
            } else {
              console.log('No open beta-testing issue found to close.');
            }

      - name: Generate Step Summary
        run: |
          echo "## 🎊 Production Release Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL:** [https://yogendra.me](https://yogendra.me)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The beta testing issue has been updated and closed." >> $GITHUB_STEP_SUMMARY
