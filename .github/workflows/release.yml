name: Build Site
on:
  push:
    tags:
      - 'v*'
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Pages
        uses: ./.github/actions/devcontainer-action
        with:
          entrypoint: task
          args: release:build

      - name: Publish to Firebase
        uses: ./.github/actions/devcontainer-action
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOGENDRA_ME }}
        with:
          entrypoint: task
          args: release:publish
    
      - name: Publish to Github
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          personal_token: ${{ secrets.YMEGHIO_PAT }}          
          external_repository: yogendra/yogendra.github.io
          publish_branch: main
          publish_dir: ./public/github

      - name: Update and Close Beta Issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'beta-testing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label]
            });

            if (issues.length > 0) {
              const issueNumber = issues[0].number;
              const tag = context.ref.replace('refs/tags/', '');
              const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              
              const comment = `## ✅ Production Release Complete\n\n- **Release Tag:** \`${tag}\`\n- **Production URL:** [https://yogendra.me](https://yogendra.me)\n- **Release Build:** [View Logs](${runUrl})\n- **Status:** Closed and Released to Production.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Updated and closed issue #${issueNumber}`);
            } else {
              console.log('No open beta-testing issue found to close.');
            }
