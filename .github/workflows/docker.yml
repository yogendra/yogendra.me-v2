name: 🐳 Build and Publish Builder Image

on:
  push:
    branches:
      - main
    paths:
      - 'builder.Dockerfile'
      - 'Taskinit.yml'
      - 'environment.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🏗️ Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yogendra.me-v2-builder
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 📦 Install Task CLI
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.38.0

      - name: 📦 Build Container Image
        run: task builder:build IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/yogendra.me-v2-builder:latest

      - name: 🧪 Test Container Image Tools
        run: task builder:test IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/yogendra.me-v2-builder:latest

      - name: 🚀 Publish Image to GHCR
        run: task builder:publish IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/yogendra.me-v2-builder:latest
