name: 👍 Release Approval
on:
  issue_comment:
    types: [created]

jobs:
  check-approval:
    name: 🔍 Check Approval
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'beta-testing')
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - name: Verify Comment Body
        id: verify
        uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment.body.trim().toUpperCase();
            if (comment === 'LGTM' || comment === 'APPROVED' || comment.includes('LGTM') || comment.includes('APPROVED')) {
              core.setOutput('approved', 'true');
            } else {
              core.setOutput('approved', 'false');
            }

  approve-release:
    name: 👍 Release Approval
    needs: check-approval
    if: needs.check-approval.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
     
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.YMEGHIO_PAT }}
      - name: 📦 Cache Task CLI
        id: cache-task
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/task
          key: ${{ runner.os }}-task-v3.38.0

      - name: Install Task CLI if missing from cache
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.38.0

      - name: 👀 What version is checked out?
        run: git log -1 -p
     
      - name: ✍️ Approved Version
        id: approved_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVED_VERSION="$(task beta:sha ISSUE_NUMBER=${{ github.event.issue.number }})"
          echo "Approved Version: $APPROVED_VERSION"
          echo "approved_version=$APPROVED_VERSION" >> $GITHUB_OUTPUT

      - name: 🎯 Next Release Version
        id: next_version
        run: |
          NEXT_VERSION="$(task next_version)"
          echo "Next Version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: 🏷️ Tag Repository
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.next_version.outputs.next_version }} ${{ steps.approved_version.outputs.approved_version }}
          git push origin ${{ steps.next_version.outputs.next_version }}

      - name: 📢 Generate Summary
        id: summary
        run: |
          echo "## ✅ Release Approved" >> $GITHUB_STEP_SUMMARY
          echo "- **New Tag:** \`${{ steps.next_version.outputs.next_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Approved By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production release workflow has been triggered by the new tag." >> $GITHUB_STEP_SUMMARY

