name: 👍 Release Approval
on:
  issue_comment:
    types: [created]

jobs:
  approve-release:
    name: 👍 Release Approval
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'beta-testing') &&
      (github.event.comment.body == 'LGTM' || github.event.comment.body == 'APPROVED')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 🔍 Extract Referenced Commit SHA
        id: extract_sha
        run: |
          SHA=$(echo "${{ github.event.issue.body }}" | grep -oE '- **Commit[ ]+:** [0-9a-f]{7,40}' | grep -oE '[0-9a-f]{7,40}' | head -n 1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT      
          
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.extract_sha.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.YMEGHIO_PAT }}

      - name: 🎯 Next Release Version
        id: next_version
        run: |
          echo "next_version=$(task next_version)" >> $GITHUB_OUTPUT

      - name: 🏷️ Tag Repository
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.next_version.outputs.next_version }}
          git push origin ${{ steps.next_version.outputs.next_version }}

      - name: 📢 Generate Summary
        id: summary
        run: |
          echo "## ✅ Release Approved" >> $GITHUB_STEP_SUMMARY
          echo "- **New Tag:** \`${{ steps.next_version.outputs.next_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Approved By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production release workflow has been triggered by the new tag." >> $GITHUB_STEP_SUMMARY

