name: 👍 Release Approval
on:
  issue_comment:
    types: [created]

jobs:
  approve-release:
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'beta-testing') &&
      (github.event.comment.body == 'LGTM' || github.event.comment.body == 'APPROVED')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.YMEGHIO_PAT }}

      - name: Get New Version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          BASE_TAG="v$DATE"
          TAG=$BASE_TAG
          COUNTER=1
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            TAG="$BASE_TAG.$COUNTER"
            COUNTER=$((COUNTER + 1))
          done
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Tag Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Generate Step Summary
        run: |
          echo "## ✅ Release Approved" >> $GITHUB_STEP_SUMMARY
          echo "- **New Tag:** \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Approved By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production release workflow has been triggered by the new tag." >> $GITHUB_STEP_SUMMARY

