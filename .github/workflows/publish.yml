name: Build Site
on:
  push:
    branches:
      - main
    paths:
      - "!.devcontainer/**"
      - "!.github/workflows/publish-devcontainer.yml"
      - "**"
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # - name: Init environment
      #   run: task init
      - name: Build Pages
        uses: ./.github/actions/devcontainer-action
        with:
          command: task
          args: release:build
      - name: Publish to Firebase
        uses: ./.github/actions/devcontainer-action
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOGENDRA_ME }}
        with:
          command: task
          args: release:publish
      - name: Publish to Github
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_YMEGHIO }}
          external_repository: yogendra/yogendra.github.io
          publish_branch: main
          publish_dir: ./public/github
