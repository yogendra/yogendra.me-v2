version: '3'

vars:
  LIB_DIR: "{{.TASKFILE_DIR}}/lib"
  DART_SASS_VERSION: "1.97.3"
  HUGO_VERSION: "0.154.5"

tasks:
  init:
    desc: Initialize the environment
    cmds:
      - task: _install:os-packages
      - task: _install:conda
      - task: _install:python-env
      - task: _install:hugo
      - task: _install:dart-sass
      - task: _install:plantuml
      - task: _install:firebase
      - task: _install:go
      - task: _install:nodejs
      - task: build-info

  build-info:
    desc: Show environment info
    silent: true
    cmd: |
      echo "Dart Sass : $(sass --version 2>/dev/null || echo 'Not installed')"
      echo "Go        : $(go version 2>/dev/null || echo 'Not installed')"
      echo "Hugo      : $(hugo version 2>/dev/null || echo 'Not installed')"
      echo "Node.js   : $(node --version 2>/dev/null || echo 'Not installed')"
      echo "Conda     : $(conda --version 2>/dev/null || echo 'Not installed')"
      echo "Python    : $(python --version 2>/dev/null || echo 'Not installed')"
      echo "PlantUML  : $(java -jar lib/plantuml.jar --version |& head -1|| echo 'Not installed')"
      echo "Firebase  : $(firebase --version 2>/dev/null || echo 'Not installed')"
      echo "Java      : $(java -version |& head -1 || echo 'Not installed')"
      echo "OS        : $(uname -s)"
      echo "Arch      : $(uname -m)"
    
  _install:conda:
    internal: true
    cmds:
      - echo "Conda not found, installing Miniconda..."
      - cmd: curl -sLo /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
        platforms: [linux/amd64]
      - cmd: curl -sLo /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-aarch64.sh
        platforms: [linux/arm64]
      - cmd: curl -sLo /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
        platforms: [darwin/arm64]
      - bash /tmp/miniconda.sh -b -p $HOME/miniconda
      - $HOME/miniconda/bin/conda init bash
      - echo "Please restart your shell to use conda."
    status:
      - command -v conda &> /dev/null

  _install:python-env:
    internal: true
    cmds:
      - conda env update -f environment.yml --prune
    status:
      - conda env list | grep -q yogendra-me

  _install:go:
    internal: true
    cmds:
      - cmd: brew install go
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y golang-go
        platforms: [linux]
    status:
      - go version

  _install:nodejs:
    internal: true
    cmds:
      - cmd: brew install node
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y nodejs
        platforms: [linux]
    status:
      - node --version

  _install:os-packages:
    internal: true
    cmds:
      - cmd: |
          brew install asciidoctor libtool graphviz
          brew link -f --overwrite asciidoctor libtool graphviz
          if ! brew list --cask temurin@21 &>/dev/null; then
            brew install --cask temurin@21
          fi
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y asciidoctor graphviz openjdk-21-jre pandoc
        platforms: [linux]

  _install:dart-sass:
    internal: true
    vars:
      ARCH_TAG: '{{if eq .ARCH "arm64"}}arm64{{else}}x64{{end}}'
    cmds:
      - cmd: brew install sass/sass/sass
        platforms: [darwin]
      - cmd: |
            curl -sLJ "https://github.com/sass/dart-sass/releases/download/{{.DART_SASS_VERSION}}/dart-sass-{{.DART_SASS_VERSION}}-linux-x64.tar.gz" | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin
        platforms: [linux/amd64]
      - cmd: |
            curl -sSL "https://github.com/sass/dart-sass/releases/download/{{.DART_SASS_VERSION}}/dart-sass-{{.DART_SASS_VERSION}}-linux-arm64.tar.gz" | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin 
        platforms: [linux/arm64]
    status:
      - sass --version | grep {{.DART_SASS_VERSION}}
  
  _install:hugo:
    internal: true
    cmds:
      - cmd: brew install hugo
        platforms: [darwin]
      - cmd: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v{{.HUGO_VERSION}}/hugo_extended_{{.HUGO_VERSION}}_linux-arm64.tar.gz" | \
            sudo tar -C /usr/local/bin -xz hugo
        platforms: [linux/arm64]
      - cmd: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v{{.HUGO_VERSION}}/hugo_extended_{{.HUGO_VERSION}}_linux-amd64.tar.gz" | \
            sudo tar -C /usr/local/bin -xz hugo
        platforms: [linux/amd64]
    status:
      - hugo version | grep {{.HUGO_VERSION}}

  _install:plantuml:
    internal: true
    vars:
      URL: 'http://sourceforge.net/projects/plantuml/files/plantuml.jar/download'
    cmds:
      - mkdir -p {{.LIB_DIR}}/
      - curl -L {{.URL}} -o {{.LIB_DIR}}/plantuml.jar
    status:
      - test -f {{.LIB_DIR}}/plantuml.jar

  _install:firebase:
    internal: true
    cmds:
      - platforms: [linux/arm64]
        cmd: |
          sudo apt-get install -qqy npm
          sudo npm install -g firebase-tools
      - platforms: [linux/amd64,darwin]
        cmd: |
          curl -sL https://firebase.tools | upgrade=true analytics=false bash
    status:
      - command -v firebase &> /dev/null
