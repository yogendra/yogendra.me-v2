- title: Modernizing Digital APIs Platform to Cloud-Native Microservices
  event: SpringOne 2019
  date: 2019-10-07
  location:  Austin, TX, USA
  video: https://www.youtube.com/watch?v=qkHUZLu7itM&t=8s
  event-page: https://tanzu.vmware.com/content/videos/abhishek-seth-migrating-open-api-implementation-from-tibco-bw-to-spring-on-pcf
  slides: https://www.slideshare.net/Pivotal/modernizing-digital-apis-platform-to-cloudnative-microservices
  roles:
    - Presenter
    - Speaker
  description: |
    One of our banking clients is migrating its assets developed on exiting stack to an open-source platform: Spring on Pivotal Platform. They started this journey by moving the Public APIs and subsequently move the Private APIs. 

    Public APIs offer integration capabilities to partners, which embed these capabilities in their platforms to bring remarkable experiences and offerings to our consumers/customers. 

    This session is to share the experience and value they created on the way by migrating to Spring on Pivotal Platform.

