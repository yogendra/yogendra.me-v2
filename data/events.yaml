- title: "Public Sector Transformation: Delivering Always-On Services with Distributed Technologies"
  type: Video
  event: Distributed SQL Summit Asia (DSS Asia) 2024
  location: Online, Singapore
  roles:
    - Presenter
    - Speaker
    - Demonstrator
  date: 2024-04-24
  event-page: https://events.ringcentral.com/canvas/events/distributed-sql-summit-asia-2024/registration
  description: |
    Advancing public sector technology requires a modern tech stack capable of delivering a seamless digital experience to users. 
    Citizens and government officers depend on always-on services with immediate access to critical data anytime and from anywhere. 
    In this session, you will hear from the Technical Consulting Team at IMDA on how they are using the cloud and distributed 
    technologies, including distributed SQL, to improve their scalability and resilience. You’ll learn what data challenges they 
    faced and why distributed SQL was a key part of their solution.
