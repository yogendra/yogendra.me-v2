version: '3'

includes:
  setup:
    taskfile: Taskinit.yml
    internal: true

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: Initialize the environment
    cmds:
      - task: setup:init      

  build-info:
    desc: Show environment info
    cmds:
      - task: setup:build-info

  release:build:
    desc: Build the site for production
    cmds:
      - task: github:build
      - task: cloudflare:build

  release:publish:
    desc: Publish the site to Firebase, Cloudflare, and GitHub
    cmds:
      - task: cloudflare:publish
      - task: github:publish

  release:deploy:
    desc: Build and deploy the site
    cmds:
      - task: release:build
      - task: release:publish

  github:build:
    desc: Build site for github pages
    cmds:
      - |
        hugo --minify -e github {{.CLI_ARGS}}
        echo -n "Version: "
        cat public/github/index.html | grep -oE '\| Version : [^ ]*' | grep -oE '[^ ]+$' || echo "built"

  github:publish:
    desc: Publish the site to GitHub Pages
    cmds:
      - |
        if [ "$CI" = "true" ]; then
          git -C public/github config user.name "github-actions[bot]"
          git -C public/github config user.email "github-actions[bot]@users.noreply.github.com"
        fi
      - git -C public/github checkout -B main
      - git -C public/github add -A .
      - git -C public/github commit -m "Publish site update" || true
      - |
        if [ -n "$YMEGHIO_PAT" ]; then
          git -C public/github remote set-url origin https://oauth2:$YMEGHIO_PAT@github.com/yogendra/yogendra.github.io.git
        fi
      - git -C public/github push --force origin HEAD:main

  github:deploy:
    desc: Build and deploy the site to GitHub Pages
    cmds:
      - task: github:build
      - task: github:publish
  
  beta:build:
    desc: Build the site for beta environment
    cmds:
      - hugo --minify --cleanDestinationDir -e cloudflare-beta {{.CLI_ARGS}}
      - |
        echo -n "Version: ";
        cat public/cloudflare-beta/index.html | grep -oE '\| Version : [^ ]*' | grep -oE '[^ ]+$' || echo "built"

  beta:publish:
    desc: Publish the site to Cloudflare Beta
    cmds:
      - npx wrangler pages deploy public/cloudflare-beta --project-name yogendra-me --branch beta

  beta:deploy:
    desc: Build and deploy the site to beta
    cmds:
      - task: beta:build
      - task: beta:publish
  

  cloudflare:build:
    desc: Build the site for Cloudflare
    cmds:
      - |
        hugo --minify --cleanDestinationDir -e cloudflare {{.CLI_ARGS}}
        echo -n "Version: "
        cat public/cloudflare/index.html | grep -oE '\| Version : [^ ]*' | grep -oE '[^ ]+$' || echo "built"

  cloudflare:publish:
    desc: Publish the static site to Cloudflare worker (Pages)
    cmds:
      - npx wrangler pages deploy public/cloudflare --project-name yogendra-me --branch main

  cloudflare:deploy:
    desc: Build and deploy the static site to Cloudflare
    cmds:
      - task: cloudflare:build
      - task: cloudflare:publish

  beta:sha:
    desc: Get beta sha
    silent: true
    vars:
      ISSUE_NUMBER: '{{.ISSUE_NUMBER}}'
      GH_TOKEN: '{{.GH_TOKEN | default ""}}'
    cmds:
      - |
        if [[ -n "{{.GH_TOKEN}}" ]] 
        then
          export GH_TOKEN={{.GH_TOKEN}}
        fi
        gh issue view {{.ISSUE_NUMBER}} --json body --template '{{.body}}' | \
          jq -r '.body' | \
          grep -oE '^- \*\*Commit[ ]+:\*\* [0-9a-f]{7,40}' | \
          grep -oE '[0-9a-f]{7,40}'

  beta:verify:
    desc: Run automated validation checks on latest beta deployment
    cmds:
      - python3 .agents/skills/publisher/scripts/verify_beta.py {{.CLI_ARGS}}

  beta:approve:
    desc: Validate beta deployment, record findings, and approve release (LGTM)
    cmds:
      - python3 .agents/skills/publisher/scripts/verify_beta.py --approve {{.CLI_ARGS}}

  build:
    desc: Build the site for local testing
    cmds:
      - task: version
      - |
        hugo --minify --cleanDestinationDir {{.CLI_ARGS}}
        cat public/local/index.html | grep -oE '\| Version : [^ ]+' | grep -oE '[^ ]+$'

  start:
    desc: Run local development server
    cmds:
      - task: stop
      - task: version
      - nohup hugo --gc --enableGitInfo -DFE --cleanDestinationDir serve {{.CLI_ARGS}} &> hugo.log &
  
  stop:
    desc: Stop local development server
    cmds:
      - killall hugo &>> /dev/null || true

  run:
    desc: Run local development server    
    cmds:
      - task: stop
      - task: version
      - hugo --gc --enableGitInfo -DFE --cleanDestinationDir serve {{.CLI_ARGS}}

  logs:
    desc: Show local development server logs
    cmds:
      - tail -f hugo.log

  theme:sync:
    desc: Sync themes/hugo-clarity submodule
    cmds:
      - git submodule update --remote themes/hugo-clarity

  post:create:
    desc: Create a new blog post
    summary: |
      Usage: task post:create -- "My Post Title"
    cmds:
      - |
        TITLE=$(echo "{{.CLI_ARGS}}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
        [ -z "$TITLE" ] && { echo "Error: Title cannot be empty"; exit 1; }
        hugo new "posts/$(date +%Y'/'%m)/${TITLE}/index.md"

  page:bundle:
    desc: Convert a markdown file to a page bundle
    summary: |
      Usage: task page:bundle -- content/posts/my-post.md
    cmds:
      - |
        FILE="{{.CLI_ARGS}}"
        [ -f "$FILE" ] || { echo "Error: File $FILE not found"; exit 1; }
        DIR=$(dirname "$FILE")
        BASE=$(basename "$FILE")
        NAME="${BASE%.*}"
        BUNDLE_DIR="$DIR/$NAME"
        mkdir -p "$BUNDLE_DIR"
        mv "$FILE" "$BUNDLE_DIR/index.md"
        echo "Converted $FILE to $BUNDLE_DIR/index.md"
  
  version:
    desc: Generate version.yaml    
    vars:
      VERSION: '{{.VERSION | default ""}}'
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - |        
        if [[ -z ${VERSION} ]] 
        then 
          VERSION=$(task next_version)
        fi
        echo "version: $VERSION" > data/version.yaml
      - cat data/version.yaml
    silent: true
    status: 
    - test -f data/version.yaml

  next_version:
    desc: Generate next version
    silent: true
    cmds:
      - |
        D=$(date -u +%Y%m%d)
        C=$(git tag -l "v$D.*" | wc -l)
        echo "v$D.$((C + 1))"
  prod_version:
    desc: Get production version
    silent: true
    cmds:
      - |
        LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG=$(git rev-list -1 --before="00:00:00" HEAD)
        fi
        # Fallback to root commit if no commit exists before today
        echo ${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD)}
  changelog:
    desc: Generate changelog
    silent: true
    cmds:
      - |
        TAG=$(task prod_version)
        CHANGELOG=$(git log $TAG..HEAD --oneline)
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="No changes since last tag."
        fi
        echo "$CHANGELOG"
  
  changes:
    desc: Get changed files
    silent: true
    cmds:
      - |
        TAG=$(task prod_version)
        FILES=$(git diff --stat $TAG..HEAD)
        if [ -z "$FILES" ]; then
          FILES="No files changed."
        fi
        echo "$FILES"
  agent:agy:
      desc: start research agent
      silent: true
      cmds: 
      - agy --dangerously-skip-permissions -c blog 
  shell:
    desc: start shell session (herdr)
    silent: true
    cmds:
      - herdr --session blog

  # ---------------------------------------------------------------------------
  # CI Runner Selection & Variable Management
  # ---------------------------------------------------------------------------
  runner:use:github:
    desc: Set CI runner to GitHub-hosted (ubuntu-latest)
    cmds:
      - gh variable set RUNNER_TYPE -b "ubuntu-latest"
      - echo "✅ CI runner set to GitHub-hosted (ubuntu-latest)"

  runner:use:homelab:
    desc: Set CI runner to Self-Hosted (homelab)
    cmds:
      - gh variable set RUNNER_TYPE -b '["self-hosted", "homelab"]'
      - echo "✅ CI runner set to Self-Hosted [\"self-hosted\", \"homelab\"]"

  runner:status:
    desc: Show current runner variable and runner status in GitHub & Docker
    cmds:
      - |
        echo "=== GitHub Repository Variables ==="
        gh variable list | grep RUNNER_TYPE || echo "RUNNER_TYPE is not set (defaults to ubuntu-latest)"
        echo ""
        echo "=== GitHub Self-Hosted Runners ==="
        gh api repos/yogendra/yogendra.me-v2/actions/runners --jq '.runners[] | {id: .id, name: .name, os: .os, status: .status, busy: .busy, labels: [.labels[].name]}' 2>/dev/null || echo "No runners registered"
        echo ""
        echo "=== Local Docker Container Status ==="
        docker ps -a --filter "name=gh-runner-yogendra-me" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

  # ---------------------------------------------------------------------------
  # Self-Hosted Runner Local Docker CRUD
  # ---------------------------------------------------------------------------
  runner:create:
    desc: Create and start a local self-hosted GitHub Actions runner in Docker
    vars:
      RUNNER_NAME: '{{.RUNNER_NAME | default "homelab-runner"}}'
      RUNNER_CONTAINER: 'gh-runner-yogendra-me'
      RUNNER_IMAGE: '{{.RUNNER_IMAGE | default "ghcr.io/yogendra/yogendra.me-v2-runner:latest"}}'
      REPO_URL: 'https://github.com/yogendra/yogendra.me-v2'
    cmds:
      - |
        echo "Fetching runner registration token from GitHub..."
        TOKEN=$(gh api --method POST repos/yogendra/yogendra.me-v2/actions/runners/registration-token --jq .token)
        if [ -z "$TOKEN" ]; then
          echo "❌ Failed to retrieve runner registration token. Check 'gh auth status'."
          exit 1
        fi

        echo "Cleaning up any existing container..."
        docker rm -f {{.RUNNER_CONTAINER}} 2>/dev/null || true

        mkdir -p /home/yogi/runner-work
        chmod 777 /home/yogi/runner-work

        echo "Launching runner container {{.RUNNER_CONTAINER}} using image {{.RUNNER_IMAGE}}..."
        docker run -d \
          --name {{.RUNNER_CONTAINER}} \
          --restart unless-stopped \
          -e REPO_URL="{{.REPO_URL}}" \
          -e RUNNER_NAME="{{.RUNNER_NAME}}" \
          -e RUNNER_TOKEN="$TOKEN" \
          -e RUNNER_LABELS="homelab,linux,x64" \
          -v /home/yogi/runner-work:/home/runner/_work \
          {{.RUNNER_IMAGE}} \
          bash -c './config.sh --url {{.REPO_URL}} --token '"$TOKEN"' --name {{.RUNNER_NAME}} --labels homelab,linux,x64 --unattended --replace && ./run.sh'

        echo "✅ Runner container created and registering with GitHub!"

  runner:start:
    desc: Start stopped runner container
    cmds:
      - docker start gh-runner-yogendra-me

  runner:stop:
    desc: Stop runner container
    cmds:
      - docker stop gh-runner-yogendra-me

  runner:logs:
    desc: Tail runner container logs
    cmds:
      - docker logs -f gh-runner-yogendra-me

  runner:delete:
    desc: Stop, remove container and deregister runner from GitHub
    vars:
      RUNNER_NAME: '{{.RUNNER_NAME | default "homelab-runner"}}'
      RUNNER_CONTAINER: 'gh-runner-yogendra-me'
    cmds:
      - |
        docker rm -f {{.RUNNER_CONTAINER}} 2>/dev/null || true
        echo "Looking up runner ID in GitHub..."
        RUNNER_ID=$(gh api repos/yogendra/yogendra.me-v2/actions/runners --jq '.runners[] | select(.name=="{{.RUNNER_NAME}}") | .id' 2>/dev/null || true)
        if [ -n "$RUNNER_ID" ]; then
          echo "Deregistering runner ID $RUNNER_ID from GitHub..."
          gh api --method DELETE repos/yogendra/yogendra.me-v2/actions/runners/$RUNNER_ID
          echo "✅ Runner deregistered from GitHub."
        else
          echo "No registered runner found on GitHub with name {{.RUNNER_NAME}}."
        fi

  # ---------------------------------------------------------------------------
  # Runner Image Lifecycle (Build, Test, Shell, Publish)
  # ---------------------------------------------------------------------------
  runner:image:build:
    desc: Build the self-hosted runner Docker image
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "ghcr.io/yogendra/yogendra.me-v2-runner:latest"}}'
    cmds:
      - docker build -t {{.IMAGE_TAG}} -f runner.Dockerfile .

  runner:image:test:
    desc: Test that all tools work inside the runner image
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "ghcr.io/yogendra/yogendra.me-v2-runner:latest"}}'
    cmds:
      - |
        echo "Testing runner image tools..."
        docker run --rm {{.IMAGE_TAG}} bash -c "
          set -e
          echo -n 'Task       : '; task --version
          echo -n 'Hugo       : '; hugo version
          echo -n 'Dart Sass  : '; sass --version
          echo -n 'Node.js    : '; node --version
          echo -n 'NPM        : '; npm --version
          echo -n 'Wrangler   : '; wrangler --version
          echo -n 'Python     : '; python3 --version
          echo -n 'Pygments   : '; pygmentize -V
          echo -n 'Rst2html   : '; rst2html --version
          echo -n 'Asciidoctor: '; asciidoctor --version
          echo -n 'Graphviz   : '; dot -V
          echo -n 'Pandoc     : '; pandoc --version | head -n 1
        "
        echo "✅ All runner image tools verified!"

  runner:image:shell:
    desc: Open interactive shell inside the runner image
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "ghcr.io/yogendra/yogendra.me-v2-runner:latest"}}'
    cmds:
      - docker run --rm -it -v {{.TASKFILE_DIR}}:/workspace -w /workspace {{.IMAGE_TAG}} bash

  runner:image:publish:
    desc: Publish runner image to GHCR
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "ghcr.io/yogendra/yogendra.me-v2-runner:latest"}}'
    cmds:
      - docker push {{.IMAGE_TAG}}


  # ---------------------------------------------------------------------------
  # Web VS Code Editor Lifecycle (blog.hs.yogendra.me)
  # ---------------------------------------------------------------------------
  editor:build:
    desc: Build the Web VS Code Editor image
    cmds:
      - docker compose -f docker-compose.editor.yml build

  editor:start:
    desc: Start the Web VS Code Editor container with Traefik routing
    cmds:
      - mkdir -p /home/yogi/.config/code-server-blog
      - docker compose -f docker-compose.editor.yml up -d
      - echo "✅ Editor started! Accessible at https://blog.hs.yogendra.me"

  editor:stop:
    desc: Stop the Web VS Code Editor container
    cmds:
      - docker compose -f docker-compose.editor.yml down

  editor:status:
    desc: Check status of the Web VS Code Editor container
    cmds:
      - docker compose -f docker-compose.editor.yml ps

  editor:logs:
    desc: Follow logs of the Web VS Code Editor container
    cmds:
      - docker compose -f docker-compose.editor.yml logs -f

  editor:log:
    desc: Alias for editor:logs
    cmds:
      - task: editor:logs

  editor:info:
    desc: Display connection and routing info for the Web VS Code Editor
    cmds:
      - |
        echo "=== Blog Web Editor Information ==="
        echo "URL          : https://blog.hs.yogendra.me"
        echo "Compose File : docker-compose.editor.yml"
        echo "Container    : blog-editor"
        echo "Auth         : Authelia (SSO via Traefik middleware)"
        echo "Workspace    : /workspace (mapped to repository root)"
        echo ""
        docker compose -f docker-compose.editor.yml ps

  editor:shell:
    desc: Open interactive shell inside the Web VS Code Editor container
    cmds:
      - docker exec -it blog-editor bash

  
