version: '3'

vars:
  LIB_DIR: "{{.TASKFILE_DIR}}/lib"
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  DART_SASS_VERSION: "1.97.3"
  HUGO_VERSION: "0.154.5"
tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: Initialize the environment
    cmds:
      - task: _install:os-packages
      - task: _install:hugo
      - task: _install:dart-sass
      - task: _install:plantuml
      - task: _install:firebase
      - task: _install:go
      - task: _install:nodejs
      - cmd: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"

  _install:go:
    internal: true
    cmds:
      - cmd: brew install go
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y golang-go
        platforms: [linux]
    status:
      - go version

  _install:nodejs:
    internal: true
    cmds:
      - cmd: brew install node
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y nodejs
        platforms: [linux]
    status:
      - node --version

  _install:os-packages:
    internal: true
    cmds:
      - cmd: |
          brew install asciidoctor libtool graphviz
          brew link -f --overwrite asciidoctor libtool graphviz
          if ! brew list --cask temurin@21 &>/dev/null; then
            brew install --cask temurin@21
          fi
        platforms: [darwin]
      - cmd: |
          sudo apt update
          sudo apt install -y asciidoctor graphviz openjdk-21-jre pandoc python3-docutils python-is-python3
          sudo pip3 install rst2html
        platforms: [linux]

  _install:dart-sass:
    internal: true
    vars:
      ARCH_TAG: '{{if eq .ARCH "arm64"}}arm64{{else}}x64{{end}}'
    cmds:
      - cmd: brew install sass/sass/sass
        platforms: [darwin]
      - cmd: |
            curl -sLJ "https://github.com/sass/dart-sass/releases/download/{{.DART_SASS_VERSION}}/dart-sass-{{.DART_SASS_VERSION}}-linux-x64.tar.gz" | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin
        platforms: [linux/amd64]
      - cmd: |
            curl -sSL "https://github.com/sass/dart-sass/releases/download/{{.DART_SASS_VERSION}}/dart-sass-{{.DART_SASS_VERSION}}-linux-arm64.tar.gz" | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin 
        platforms: [linux/arm64]
    status:
      - sass --version | grep {{.DART_SASS_VERSION}}
  
  _install:hugo:
    internal: true
    cmds:
      - cmd: brew install hugo
        platforms: [darwin]
      - cmd: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v{{.HUGO_VERSION}}/hugo_extended_{{.HUGO_VERSION}}_linux-arm64.tar.gz" | \
            sudo tar -C /usr/local/bin -xz hugo
        platforms: [linux/arm64]
      - cmd: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v{{.HUGO_VERSION}}/hugo_extended_{{.HUGO_VERSION}}_linux-amd64.tar.gz" | \
            sudo tar -C /usr/local/bin -xz hugo
        platforms: [linux/amd64]
    status:
      - hugo version | grep {{.HUGO_VERSION}}

  _install:plantuml:
    internal: true
    vars:
      URL: 'http://sourceforge.net/projects/plantuml/files/plantuml.jar/download'
    cmds:
      - mkdir -p {{.LIB_DIR}}/
      - curl -L {{.URL}} -o {{.LIB_DIR}}/plantuml.jar
    status:
      - test -f {{.LIB_DIR}}/plantuml.jar

  _install:firebase:
    internal: true
    cmds:
      - platforms: [linux/arm64]
        cmd: |
          sudo apt-get install -qqy npm
          sudo npm install -g firebase-tools
      - platforms: [linux/amd64,darwin]
        cmd: |
          curl -sL https://firebase.tools | upgrade=true analytics=false bash
    status:
      - command -v firebase &> /dev/null

  release:build:
    desc: Build the site for production
    cmds:
      - hugo --minify --cleanDestinationDir -e firebase
      - hugo --minify --cleanDestinationDir -e github

  release:publish:
    desc: Publish the site to Firebase
    cmds:
      - |
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gac.json
        echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > $GOOGLE_APPLICATION_CREDENTIALS
        firebase deploy --only hosting

  release:deploy:
    desc: Build and deploy the site
    cmds:
      - task: release:build
      - task: release:publish

  beta:build:
    desc: Build the site for beta environment
    cmds:
      - hugo --minify --cleanDestinationDir -e firebase-beta

  beta:publish:
    desc: Publish the site to Firebase Beta
    cmds:
      - |
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gac.json
        echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > $GOOGLE_APPLICATION_CREDENTIALS
        firebase deploy --only hosting:yogendra-me-beta

  beta:deploy:
    desc: Build and deploy the site to beta
    cmds:
      - task: beta:build
      - task: beta:publish

  local:build:
    desc: Build the site for local testing
    cmds:
      - hugo --minify --cleanDestinationDir -e local

  local:run:
    desc: Run local development server
    cmds:
      - killall hugo &>> /dev/null || true
      - nohup hugo --gc --enableGitInfo -DFE --cleanDestinationDir -e local serve &> hugo.log &
  
  local:logs:
    desc: Show local development server logs
    cmds:
      - tail -f hugo.log

  dev-container:build:
    desc: Build the devcontainer image
    vars:
      SCOPE_DIR: .devcontainer
      DOCKERFILE: '{{.SCOPE_DIR}}/Dockerfile'
      IMAGE_NAME: ghcr.io/yogendra/yogendra-me-devcontainer
    cmds:
      - docker buildx build -t {{.IMAGE_NAME}}:latest --platform=linux/amd64 --platform=linux/arm64 --push -f {{.DOCKERFILE}} {{.SCOPE_DIR}}
      - docker buildx build -t {{.IMAGE_NAME}}-ghaction:latest --platform=linux/amd64 --platform=linux/arm64 --push -f {{.SCOPE_DIR}}/ghaction/Dockerfile {{.PROJECT_DIR}}

  dev-container:test:
    desc: Run the devcontainer
    cmds:
      - docker run --name yogendra-me-devcontainer --hostname yogendra-me-devcontainer --rm -it -v {{.PROJECT_DIR}}:/workspace --workdir /workspace --entrypoint /bin/bash ghcr.io/yogendra/yogendra-me-devcontainer:latest

  dev-container:test-ghaction:
    desc: Run the devcontainer
    cmds:
      - docker run --name yogendra-me-devcontainer-ghaction --hostname yogendra-me-devcontainer-ghaction --rm -it -v {{.PROJECT_DIR}}:/workspace --workdir /workspace --entrypoint /bin/bash ghcr.io/yogendra/yogendra-me-devcontainer-ghaction:latest

  post:create:
    desc: Create a new blog post
    summary: |
      Usage: task post:create -- "My Post Title"
    cmds:
      - |
        TITLE=$(echo "{{.CLI_ARGS}}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
        [ -z "$TITLE" ] && { echo "Error: Title cannot be empty"; exit 1; }
        hugo new "posts/$(date +%Y'/'%m)/${TITLE}/index.md"

  page:bundle:
    desc: Convert a markdown file to a page bundle
    summary: |
      Usage: task page:bundle -- content/posts/my-post.md
    cmds:
      - |
        FILE="{{.CLI_ARGS}}"
        [ -f "$FILE" ] || { echo "Error: File $FILE not found"; exit 1; }
        DIR=$(dirname "$FILE")
        BASE=$(basename "$FILE")
        NAME="${BASE%.*}"
        BUNDLE_DIR="$DIR/$NAME"
        mkdir -p "$BUNDLE_DIR"
        mv "$FILE" "$BUNDLE_DIR/index.md"
        echo "Converted $FILE to $BUNDLE_DIR/index.md"
