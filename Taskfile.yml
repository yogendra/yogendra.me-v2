version: '3'

includes:
  setup:
    taskfile: Taskinit.yml
    internal: true

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: Initialize the environment
    cmds:
      - task: setup:init      

  build-info:
    desc: Show environment info
    cmds:
      - task: setup:build-info

  release:build:
    desc: Build the site for production
    cmds:
      - task: github:build
      - task: cloudflare:build

  release:publish:
    desc: Publish the site to Firebase, Cloudflare, and GitHub
    cmds:
      - task: cloudflare:publish
      - task: github:publish

  release:deploy:
    desc: Build and deploy the site
    cmds:
      - task: release:build
      - task: release:publish

  github:build:
    desc: Build site for github pages
    cmds:
    - |
        (cd public/github && git clean -ffxd)
        git submodule update --remote public/github
        hugo --minify -e github {{.CLI_ARGS}}
        echo -n "Version: "
        cat public/github/index.html | grep -oE '\| Version : [^ ]+'| grep -oE '[^ ]+$'

  github:publish:
    desc: Publish the site to GitHub Pages
    cmds:
      - |
        if [ "$CI" = "true" ]; then
          git -C public/github config user.name "github-actions[bot]"
          git -C public/github config user.email "github-actions[bot]@users.noreply.github.com"
        fi
      - git -C public/github add .
      - git -C public/github commit -m "Publish site update" || true
      - |
        if [ -n "$YMEGHIO_PAT" ]; then
          git -C public/github remote set-url origin https://x-access-token:$YMEGHIO_PAT@github.com/yogendra/yogendra.github.io.git
        fi
      - git -C public/github push origin main

  github:deploy:
    desc: Build and deploy the site to GitHub Pages
    cmds:
      - task: github:build
      - task: github:publish
  
  beta:build:
    desc: Build the site for beta environment
    cmds:
      - hugo --minify --cleanDestinationDir -e cloudflare-beta {{.CLI_ARGS}}
      - |
        echo -n "Version: ";
        cat public/cloudflare-beta/index.html | grep -oE '\| Version : [^ ]+'| grep -oE '[^ ]+$'

  beta:publish:
    desc: Publish the site to Cloudflare Beta
    cmds:
      - npx wrangler pages deploy public/cloudflare-beta --project-name yogendra-me --branch beta

  beta:deploy:
    desc: Build and deploy the site to beta
    cmds:
      - task: beta:build
      - task: beta:publish
  

  cloudflare:build:
    desc: Build the site for Cloudflare
    cmds:
      - |
        hugo --minify --cleanDestinationDir -e cloudflare {{.CLI_ARGS}}
        echo -n "Version: "
        cat public/cloudflare/index.html | grep -oE '\| Version : [^ ]+'| grep -oE '[^ ]+$'

  cloudflare:publish:
    desc: Publish the static site to Cloudflare worker (Pages)
    cmds:
      - npx wrangler pages deploy public/cloudflare --project-name yogendra-me

  cloudflare:deploy:
    desc: Build and deploy the static site to Cloudflare
    cmds:
      - task: cloudflare:build
      - task: cloudflare:publish

  beta:sha:
    desc: Get beta sha
    silent: true
    vars:
      ISSUE_NUMBER: '{{.ISSUE_NUMBER}}'
      GH_TOKEN: '{{.GH_TOKEN | default ""}}'
    cmds:
      - |
        if [[ -n "{{.GH_TOKEN}}" ]] 
        then
          export GH_TOKEN={{.GH_TOKEN}}
        fi
        gh issue view {{.ISSUE_NUMBER}} --json body --template '{{.body}}' | \
          jq -r '.body' | \
          grep -oE '^- \*\*Commit[ ]+:\*\* [0-9a-f]{7,40}' | \
          grep -oE '[0-9a-f]{7,40}'

  build:
    desc: Build the site for local testing
    cmds:
      - task: version
      - |
        hugo --minify --cleanDestinationDir {{.CLI_ARGS}}
        cat public/local/index.html | grep -oE '\| Version : [^ ]+' | grep -oE '[^ ]+$'

  start:
    desc: Run local development server
    cmds:
      - task: stop
      - task: version
      - nohup hugo --gc --enableGitInfo -DFE --cleanDestinationDir serve {{.CLI_ARGS}} &> hugo.log &
  
  stop:
    desc: Stop local development server
    cmds:
      - killall hugo &>> /dev/null || true

  run:
    desc: Run local development server    
    cmds:
      - task: stop
      - task: version
      - hugo --gc --enableGitInfo -DFE --cleanDestinationDir serve {{.CLI_ARGS}}

  logs:
    desc: Show local development server logs
    cmds:
      - tail -f hugo.log

  theme:sync:
    desc: Sync themes/hugo-clarity submodule
    cmds:
      - git submodule update --remote themes/hugo-clarity

  post:create:
    desc: Create a new blog post
    summary: |
      Usage: task post:create -- "My Post Title"
    cmds:
      - |
        TITLE=$(echo "{{.CLI_ARGS}}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
        [ -z "$TITLE" ] && { echo "Error: Title cannot be empty"; exit 1; }
        hugo new "posts/$(date +%Y'/'%m)/${TITLE}/index.md"

  page:bundle:
    desc: Convert a markdown file to a page bundle
    summary: |
      Usage: task page:bundle -- content/posts/my-post.md
    cmds:
      - |
        FILE="{{.CLI_ARGS}}"
        [ -f "$FILE" ] || { echo "Error: File $FILE not found"; exit 1; }
        DIR=$(dirname "$FILE")
        BASE=$(basename "$FILE")
        NAME="${BASE%.*}"
        BUNDLE_DIR="$DIR/$NAME"
        mkdir -p "$BUNDLE_DIR"
        mv "$FILE" "$BUNDLE_DIR/index.md"
        echo "Converted $FILE to $BUNDLE_DIR/index.md"
  
  version:
    desc: Generate version.yaml    
    vars:
      VERSION: '{{.VERSION | default ""}}'
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - |        
        if [[ -z ${VERSION} ]] 
        then 
          VERSION=$(task next_version)
        fi
        echo "version: $VERSION" > data/version.yaml
      - cat data/version.yaml
    silent: true
    status: 
    - test -f data/version.yaml

  next_version:
    desc: Generate next version
    silent: true
    cmds:
      - |
        D=$(date -u +%Y%m%d)
        C=$(git tag -l "v$D.*" | wc -l)
        echo "v$D.$((C + 1))"
  prod_version:
    desc: Get production version
    silent: true
    cmds:
      - |
        LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG=$(git rev-list -1 --before="00:00:00" HEAD)
        fi
        # Fallback to root commit if no commit exists before today
        echo ${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD)}
  changelog:
    desc: Generate changelog
    silent: true
    cmds:
      - |
        TAG=$(task prod_version)
        CHANGELOG=$(git log $TAG..HEAD --oneline)
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="No changes since last tag."
        fi
        echo "$CHANGELOG"
  
  changes:
    desc: Get changed files
    silent: true
    cmds:
      - |
        TAG=$(task prod_version)
        FILES=$(git diff --stat $TAG..HEAD)
        if [ -z "$FILES" ]; then
          FILES="No files changed."
        fi
        echo "$FILES"
  