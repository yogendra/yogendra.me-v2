baseURL = 'https://yogendra.me'
publishDir = "public/default"

languageCode = 'en-us'
title = 'Chase Your Dreams'
copyright = "Copyright © 2012–2024, Yogendra Rampuria; all rights reserved."
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

disqusShortname = "yogendrarampuria"
theme = ["hugo-clarity"]

# Pagination
[pagination]
  pagerSize = 10
  path = "page"

# Google analytics
googleAnalytics = "UA-21164716-2"


# [languages]
# config/_default/languages.toml

# [menus]
# config/_default/menus/menu.xx.toml


[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[permalinks]
  posts = "/:year/:month/:day/:slug/"

